[project]
name = "canvaskit"
version = "0.1.0"
description = "Agent-friendly CLI for SJTU Canvas: lecture subtitles, slide snapshots, course files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
canvaskit = "canvaskit.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvaskit"]
